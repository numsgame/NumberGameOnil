<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Table</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 10px;
      background-color: #ffffff;
      color: #333;
    }
    .status-bar {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }
    .table-container {
      max-height: 80vh;
      overflow: auto;
      border: 1px solid #d0d7de;
      border-radius: 4px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      user-select: text;
    }
    th, td {
      border: 1px solid #d0d7de;
      padding: 6px 10px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background-color: #34495e;
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    tr:hover {
      background-color: #eaf3ff;
    }
    ::selection {
      background-color: #b3d7ff;
      color: #000;
    }
  </style>
</head>
<body>

  <div id="status" class="status-bar">Loading data...</div>
  <div class="table-container">
    <table id="excel-table"></table>
  </div>

  <script>
    fetch('data?t=' + Date.now())
      .then(response => {
        if (!response.ok) throw new Error('Could not find or load the "data" file.');
        return response.text();
      })
      .then(rawText => {
        parseAndRender(rawText);
        document.getElementById('status').innerText = 'Data loaded successfully. Drag to select cells and press Ctrl+C to copy.';
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Error: ' + err.message;
      });

    function parseAndRender(text) {
      let rows = [];

      // If text contains pipe '|', parse by pipe tokens
      if (text.includes('|')) {
        let tokens = text.split('|')
          .map(t => t.trim())
          .filter(t => t !== '' && !t.startsWith('---'));

        if (tokens.length >= 8) {
          // Define clean header
          rows.push(["User ID", "Party Type", "Day1", "Day2", "28/06/2026", "29/06/2026", "30/06/2026", "01/07/2026"]);
          
          let dataTokens = tokens.slice(8);
          for (let i = 0; i < dataTokens.length; i += 7) {
            let chunk = dataTokens.slice(i, i + 7);
            if (chunk.length < 7) continue;

            let firstParts = chunk[0].split(/\s+/);
            let userId = firstParts[0] || '';
            let partyType = firstParts.slice(1).join(' ') || '';

            rows.push([userId, partyType, ...chunk.slice(1)]);
          }
        }
      } else {
        // Fallback for standard line-by-line CSV parsing
        let lines = text.split(/\r?\n/);
        lines.forEach(line => {
          if (line.trim()) rows.push(line.split(',').map(c => c.trim()));
        });
      }

      renderTable(rows);
    }

    function renderTable(rows) {
      const table = document.getElementById('excel-table');
      table.innerHTML = '';

      rows.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');
        row.forEach(cell => {
          const tag = (rowIndex === 0) ? 'th' : 'td';
          const el = document.createElement(tag);
          el.textContent = cell;
          tr.appendChild(el);
        });
        table.appendChild(tr);
      });
    }
  </script>

</body>
</html>
