<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Table</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 10px;
      background-color: #ffffff;
      color: #333;
    }
    .status-bar {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }
    .table-container {
      max-height: 80vh;
      overflow: auto;
      border: 1px solid #d0d7de;
      border-radius: 4px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      user-select: text;
    }
    th, td {
      border: 1px solid #d0d7de;
      padding: 6px 10px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background-color: #34495e;
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    tr:hover {
      background-color: #eaf3ff;
    }
    ::selection {
      background-color: #b3d7ff;
      color: #000;
    }
  </style>
</head>
<body>

  <div id="status" class="status-bar">Loading data...</div>
  <div class="table-container">
    <table id="excel-table"></table>
  </div>

  <script>
    // Fetch data with a timestamp parameter to force fresh daily loads
    fetch('data?t=' + Date.now())
      .then(response => {
        if (!response.ok) throw new Error('Could not find or load the "data" file.');
        return response.text();
      })
      .then(csvText => {
        Papa.parse(csvText, {
          skipEmptyLines: true,
          delimitersToGuess: [',', '|', '\t', ';'],
          complete: function(results) {
            renderTable(results.data);
            document.getElementById('status').innerText = 'Data loaded successfully. Select cells and press Ctrl+C to copy.';
          }
        });
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Error: ' + err.message;
      });

    function renderTable(data) {
      const table = document.getElementById('excel-table');
      table.innerHTML = '';

      data.forEach((row, rowIndex) => {
        let cleanRow = row.map(cell => cell.trim()).filter(cell => cell !== '');

        // Ignore leftover markdown divider lines like |---|---|
        if (cleanRow.length === 0 || cleanRow[0].startsWith('---') || cleanRow[0].includes('-----')) {
          return;
        }

        // Auto-split combined ID + Type entries if unformatted raw data is pasted
        if (rowIndex > 0 && cleanRow.length > 0) {
          const parts = cleanRow[0].split(/\s+/);
          if (parts.length >= 2) {
            const id = parts[0];
            const type = parts.slice(1).join(' ');
            cleanRow = [id, type, ...cleanRow.slice(1)];
          }
        }

        const tr = document.createElement('tr');
        cleanRow.forEach(cell => {
          const tag = (rowIndex === 0) ? 'th' : 'td';
          const el = document.createElement(tag);
          el.textContent = cell;
          tr.appendChild(el);
        });
        table.appendChild(tr);
      });
    }
  </script>

</body>
</html>
