<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Table</title>
  <!-- PapaParse CDN for parsing CSV content -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 10px;
      background-color: #ffffff;
      color: #333;
    }
    .status-bar {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }
    .table-container {
      max-height: 80vh;
      overflow: auto;
      border: 1px solid #d0d7de;
      border-radius: 4px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      user-select: text; /* Allows click-and-drag cell selection */
    }
    th, td {
      border: 1px solid #d0d7de;
      padding: 6px 10px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background-color: #f2f4f7;
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 600;
      color: #1f2328;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    tr:hover {
      background-color: #eaf3ff;
    }
    ::selection {
      background-color: #b3d7ff;
      color: #000;
    }
  </style>
</head>
<body>

  <div id="status" class="status-bar">Loading data...</div>
  <div class="table-container">
    <table id="excel-table"></table>
  </div>

  <script>
    // Fetch the raw CSV data file directly from the repo
    fetch('data')
      .then(response => {
        if (!response.ok) {
          throw new Error('Could not find or load the "data" file.');
        }
        return response.text();
      })
      .then(csvText => {
        Papa.parse(csvText, {
          skipEmptyLines: true,
          complete: function(results) {
            renderTable(results.data);
            document.getElementById('status').innerText = 'Data loaded successfully. Drag to select cells and press Ctrl+C to copy.';
          }
        });
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Error: ' + err.message;
      });

    function renderTable(data) {
      const table = document.getElementById('excel-table');
      table.innerHTML = '';

      data.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');
        row.forEach(cell => {
          const tag = rowIndex === 0 ? 'th' : 'td';
          const el = document.createElement(tag);
          el.textContent = cell;
          tr.appendChild(el);
        });
        table.appendChild(tr);
      });
    }
  </script>

</body>
</html>
