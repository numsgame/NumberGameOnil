<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/handsontable@12/dist/handsontable.full.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/handsontable@12/dist/handsontable.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #sheet { height: 400px; width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <h2>Daily Anonymous Data</h2>
  <div id="sheet"></div>

  <script>
    const container = document.getElementById('sheet');

    const data = [
      ['Date', 'Task', 'Status', 'Notes'],
      ['2025-04-09', 'Update site', 'In Progress', 'Need VPN test'],
      ['2025-04-08', 'Fix login bug', 'Done', ''],
      ['2025-04-07', 'Design mockup', 'Pending', 'Waiting for feedback']
    ];

    new Handsontable(container, {
      data: data,
      colHeaders: true,
      rowHeaders: true,
      contextMenu: true,
      manualColumnResize: true,
      manualRowResize: true,
      stretchH: 'all',
      licenseKey: 'non-commercial-and-evaluation'
    });
  </script>

</body>
</html>
