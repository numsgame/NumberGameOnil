<script>
  const container = document.getElementById('sheet');

  // Load data from localStorage or start fresh
  const savedData = localStorage.getItem('handsontableData');
  const initialData = savedData
    ? JSON.parse(savedData)
    : [
        ['Date', 'Task', 'Status', 'Notes'],
        ['2025-04-09', 'Update site', 'In Progress', 'Need VPN test'],
        ['2025-04-08', 'Fix login bug', 'Done', ''],
        ['2025-04-07', 'Design mockup', 'Pending', 'Waiting for feedback']
      ];

  const hot = new Handsontable(container, {
    data: initialData,
    colHeaders: true,
    rowHeaders: true,
    contextMenu: true,
    manualColumnResize: true,
    manualRowResize: true,
    stretchH: 'all',
    licenseKey: 'non-commercial-and-evaluation'
  });

  // Save button
  const saveBtn = document.createElement('button');
  saveBtn.textContent = '💾 Save Data';
  saveBtn.style.marginTop = '10px';
  saveBtn.onclick = () => {
    const currentData = hot.getData();
    localStorage.setItem('handsontableData', JSON.stringify(currentData));
    alert('✅ Data saved!');
  };

  container.parentNode.appendChild(saveBtn);
</script>
